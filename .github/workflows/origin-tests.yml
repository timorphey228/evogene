name: EvoGene tests
on:
  push:
    branches:
      - main
      - fix/objective-evidence-matrix
  pull_request:
    paths:
      - "evogene/**"
      - "tests/**"
      - "auto_app.py"
      - "requirements.txt"
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q evogene app.py auto_app.py
      - run: python -m unittest discover -s tests -v
